<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="t"><title id="t">Engineering approach</title><rect width="1200" height="220" rx="22" fill="#0b1220" stroke="#263449"/><text x="38" y="44" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#f1f5f9" letter-spacing="1">HOW I APPROACH ENGINEERING</text><g font-family="Inter,Segoe UI,Arial,sans-serif"><g><rect x="32" y="67" width="360" height="118" rx="15" fill="#101d30" stroke="#2c7280"/><circle cx="61" cy="96" r="8" fill="#67e8f9"/><text x="82" y="103" fill="#67e8f9" font-size="19" font-weight="700">BUILD</text><text x="54" y="135" fill="#e2e8f0" font-size="17">Useful AI-powered applications</text><text x="54" y="160" fill="#94a3b8" font-size="14">Solve real problems with clear UX.</text></g><g><rect x="420" y="67" width="360" height="118" rx="15" fill="#15182d" stroke="#6655a4"/><circle cx="449" cy="96" r="8" fill="#a5b4fc"/><text x="470" y="103" fill="#c4b5fd" font-size="19" font-weight="700">SECURE</text><text x="442" y="135" fill="#e2e8f0" font-size="17">Think about risks from day one</text><text x="442" y="160" fill="#94a3b8" font-size="14">Prioritize trust, privacy, and safety.</text></g><g><rect x="808" y="67" width="360" height="118" rx="15" fill="#101f25" stroke="#34785e"/><circle cx="837" cy="96" r="8" fill="#86efac"/><text x="858" y="103" fill="#86efac" font-size="19" font-weight="700">KEEP LEARNING</text><text x="830" y="135" fill="#e2e8f0" font-size="17">Experiment, measure, improve</text><text x="830" y="160" fill="#94a3b8" font-size="14">Turn ideas into maintainable systems.</text></g></g><circle cx="1167" cy="29" r="4" fill="#86efac"><animate attributeName="opacity" values="1;.25;1" dur="2.5s" repeatCount="indefinite"/></circle></svg>