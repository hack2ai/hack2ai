<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="t"><title id="t">Engineering principles</title><rect width="1200" height="220" rx="22" fill="#0a111e" stroke="#273449"/><text x="34" y="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" letter-spacing="1.2" fill="#f1f5f9">ENGINEERING PRINCIPLES</text><text x="1165" y="41" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.3" fill="#64748b">BUILD  /  SECURE  /  ITERATE</text><g font-family="Inter,Segoe UI,Arial,sans-serif"><g><rect x="30" y="62" width="365" height="128" rx="15" fill="#0f1e2c" stroke="#245a6b"/><rect x="30" y="62" width="4" height="128" rx="2" fill="#22d3ee"/><text x="54" y="96" fill="#67e8f9" font-size="18" font-weight="750">01  /  BUILD</text><text x="54" y="127" fill="#e2e8f0" font-size="17">Useful AI-powered applications</text><text x="54" y="154" fill="#94a3b8" font-size="14">Start with the problem, not the hype.</text></g><g><rect x="417" y="62" width="365" height="128" rx="15" fill="#17172b" stroke="#554b8c"/><rect x="417" y="62" width="4" height="128" rx="2" fill="#a5b4fc"/><text x="441" y="96" fill="#c4b5fd" font-size="18" font-weight="750">02  /  SECURE</text><text x="441" y="127" fill="#e2e8f0" font-size="17">Design for trust and resilience</text><text x="441" y="154" fill="#94a3b8" font-size="14">Consider risk throughout the lifecycle.</text></g><g><rect x="804" y="62" width="366" height="128" rx="15" fill="#10201f" stroke="#2d6a58"/><rect x="804" y="62" width="4" height="128" rx="2" fill="#34d399"/><text x="828" y="96" fill="#86efac" font-size="18" font-weight="750">03  /  ITERATE</text><text x="828" y="127" fill="#e2e8f0" font-size="17">Test, learn, improve, repeat</text><text x="828" y="154" fill="#94a3b8" font-size="14">Turn experiments into useful systems.</text></g></g><circle cx="1170" cy="18" r="3.5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="2.5s" repeatCount="indefinite"/></circle></svg>